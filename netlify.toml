[build]
  # `db:migrate:deploy` applies pending Prisma migrations against the branch's
  # Netlify DB before the site is built. A failed migration fails the deploy
  # rather than publishing a build that expects columns the database lacks.
  command = "npm run db:migrate:deploy && npm run build"
  publish = ".next"

[build.environment]
  # Prisma 6 needs a modern Node; Netlify DB itself requires >= 22.12.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The reserved CONTEXT/NETLIFY build flags aren't forwarded to the deployed
# function's runtime — only custom context-scoped vars are. src/lib/storage.ts
# reads DEPLOY_CONTEXT at request time to pick the persistent vs. deploy-scoped
# Blobs store.
[context.production.environment]
  DEPLOY_CONTEXT = "production"

[context.deploy-preview.environment]
  DEPLOY_CONTEXT = "deploy-preview"

[context.branch-deploy.environment]
  DEPLOY_CONTEXT = "branch-deploy"
